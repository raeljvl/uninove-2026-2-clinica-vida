<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clinica vida mais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<form class="form-agendamento" action="/agendamento" method="post">
  
  <fieldset>
    <legend>Dados do paciente</legend>
    <div class="form-grid">
      
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
      </div>
      
      <div class="campo">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
      </div>
      
      <div class="campo">
        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" name="nascimento" required>
      </div>
      
      <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
      </div>
      
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="nome@email.com" required>
      </div>
      
    </div>
  </fieldset>

  <!-- teste agendamento -->

  <fieldset>
    <legend>Dados da consulta</legend>
    <div class="form-grid">
      
      <div class="campo">
        <label for="especialidade">Especialidade</label>
        <select id="especialidade" name="especialidade" required>
          <option value="">Selecione</option>
          <option value="cardiologia">Cardiologia</option>
          <option value="pediatria">Pediatria</option>
          <option value="ortopedia">Ortopedia</option>
        </select>
      </div>
      
      <div class="campo">
        <label for="medico">Médico</label>
        <select id="medico" name="medico" required>
          <option value="">Selecione o médico</option>
          <option value="dr-silva">Dr. Carlos Silva</option>
          <option value="dra-maria">Dra. Maria Souza</option>
        </select>
      </div>
      
      <div class="campo">
        <label for="data">Data da Consulta</label>
        <input type="date" id="data" name="data" required>
      </div>
      
      <div class="campo">
        <label for="horario">Horário</label>
        <input type="time" id="horario" name="horario" required>
      </div>
      
      <div class="campo campo-largo">
        <label for="observacoes">Observações</label>
        <textarea id="observacoes" name="observacoes" rows="3" placeholder="Caso haja alguma observação, digite aqui..." maxlength="300"></textarea>
      </div>
      
    </div>
  </fieldset>

  <button type="submit">Agendar consulta</button>
</form>

</body>
</html>
